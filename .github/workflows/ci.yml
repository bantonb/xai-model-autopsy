name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache pretrained backbone weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-torch-${{ runner.os }}-convnext-small-v1

      - name: Install CPU torch + project deps
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel; matches the >=2.4,<2.5 pin in pyproject.
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch>=2.4,<2.5" "torchvision>=0.19,<0.20"
          pip install -e ".[dev]"

      - name: pytest
        run: pytest -q

      - name: defect_demo smoke
        run: python -m defect_demo.run --no-plot
