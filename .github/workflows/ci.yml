name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pretrained backbone weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: hf-torch-${{ runner.os }}-convnext-small-v1

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install CPU torch + project deps
        run: |
          # CPU-only torch wheel; matches the >=2.4,<2.5 pin in pyproject.
          uv pip install --system --index https://download.pytorch.org/whl/cpu \
            "torch>=2.4,<2.5" "torchvision>=0.19,<0.20"
          # histolab 0.7.0 pins openslide-python<1.3.2, but that pin is
          # stale and 1.4.x is API-compatible for our usage. Override it
          # to match the local uv-managed venv (openslide-python 1.4.6).
          echo "openslide-python>=1.4,<2" > /tmp/ci-overrides.txt
          uv pip install --system --overrides /tmp/ci-overrides.txt -e ".[dev]"

      - name: pytest
        run: pytest -q

      - name: defect_demo smoke
        run: python -m defect_demo.run --no-plot
