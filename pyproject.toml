[project]
name = "xai-model-autopsy"
version = "0.1.0"
description = "Autopsy of an XAI classifier: a defect where a two-neuron BCE head produces mutually exclusive outputs, and a controlled comparison that removes the coupling."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Anton Burckhardt" }]
dependencies = [
  # torch 2.4.x is the last line to support MPS on macOS 12.3+ (13.x).
  # torch >=2.5 requires macOS 14.0+ for MPS — this box is on 13.2.1.
  "torch>=2.4,<2.5",
  "torchvision>=0.19,<0.20",
  "timm>=1.0,<2",
  "captum>=0.7,<1",
  "histolab>=0.7,<1",
  # openslide-python 1.4+ auto-discovers the dylib shipped in openslide-bin;
  # without openslide-bin, the user must brew install openslide and expose the
  # dylib via DYLD_LIBRARY_PATH.
  "openslide-python>=1.4,<2",
  "openslide-bin>=4,<5",
  "numpy>=1.23,<1.25",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This project is an application layout (defect_demo/, pipeline/, tests/),
# not a distributable library. No packages are exported.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
